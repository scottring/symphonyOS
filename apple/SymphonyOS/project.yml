name: SymphonyOS
options:
  bundleIdPrefix: com.scottkaufman
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SymphonyOS:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SymphonyOS
        excludes:
          - "**/*.md"   # docs (e.g. Intents/README.md) must not ship as bundle resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottkaufman.symphonyos
        INFOPLIST_FILE: SymphonyOS/App/Info.plist
        # MUST be NO: with a manual INFOPLIST_FILE, GENERATE_INFOPLIST_FILE=YES makes
        # Xcode inject CFBundleVersion from CURRENT_PROJECT_VERSION — and Xcode Cloud
        # sets CURRENT_PROJECT_VERSION to its low build-run number (14, 15, …),
        # clobbering the high number ci_pre_xcodebuild writes into Info.plist. That
        # made every CI build land in TestFlight numbered below build 101, so it never
        # offered as an update. NO → the manual Info.plist's CFBundleVersion wins.
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: Symphony
        # Xcode Cloud FORCES CFBundleVersion = CI_BUILD_NUMBER (14, 15, …) during the
        # archive, after ci_pre_xcodebuild — unoverridable from the project (verified
        # by reading the archived app's Info.plist: build 20 shipped as "20" despite
        # the script writing 2020). Those low numbers sit below the old manual builds
        # (100/101/1200), so TestFlight never offered CI builds as updates. Fix: order
        # by MARKETING_VERSION instead — TestFlight compares the version string first,
        # so a 1.0.1 build (even build 21) is newer than every 1.0.0 build. Bump this
        # whenever you need CI builds to supersede a manual/App Store upload.
        MARKETING_VERSION: "1.0.1"
        CURRENT_PROJECT_VERSION: "1201"
        # Signing team lives here (not just in the generated pbxproj) so `xcodegen`
        # regeneration is safe and reproducible — regenerating no longer wipes the
        # team. Actual cert/profile is resolved at archive time via the App Store
        # Connect API key + -allowProvisioningUpdates.
        DEVELOPMENT_TEAM: XT33G7U496
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # The entitlements file holds macOS App Sandbox keys, which are invalid on
        # iOS and break device signing. Apply them only for the macOS SDK; iOS uses
        # the default entitlements from its provisioning profile.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SymphonyOS/App/SymphonyOS.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: Supabase
        product: Supabase

  SymphonyOSTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SymphonyOSTests
    dependencies:
      - target: SymphonyOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottkaufman.symphonyos.tests
        # The app target overrides PRODUCT_NAME to "Symphony", but xcodegen
        # derives TEST_HOST from the target name — point it at the real binary.
        "TEST_HOST[sdk=iphonesimulator*]": "$(BUILT_PRODUCTS_DIR)/Symphony.app/Symphony"
        "TEST_HOST[sdk=iphoneos*]": "$(BUILT_PRODUCTS_DIR)/Symphony.app/Symphony"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Symphony.app/Contents/MacOS/Symphony"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

  SymphonyOSUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SymphonyOSUITests
    dependencies:
      - target: SymphonyOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottkaufman.symphonyos.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SymphonyOS:
    build:
      targets:
        SymphonyOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SymphonyOSTests
        - SymphonyOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
