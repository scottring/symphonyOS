name: SymphonyOS
options:
  bundleIdPrefix: com.scottkaufman
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: "2.0.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    SWIFT_STRICT_CONCURRENCY: complete

targets:
  SymphonyOS:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SymphonyOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottkaufman.symphonyos
        INFOPLIST_FILE: SymphonyOS/App/Info.plist
        PRODUCT_NAME: Symphony
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        # The entitlements file holds macOS App Sandbox keys, which are invalid on
        # iOS and break device signing. Apply them only for the macOS SDK; iOS uses
        # the default entitlements from its provisioning profile.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SymphonyOS/App/SymphonyOS.entitlements
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    dependencies:
      - package: Supabase
        product: Supabase

  SymphonyOSTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SymphonyOSTests
    dependencies:
      - target: SymphonyOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottkaufman.symphonyos.tests

  SymphonyOSUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SymphonyOSUITests
    dependencies:
      - target: SymphonyOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.scottkaufman.symphonyos.uitests

schemes:
  SymphonyOS:
    build:
      targets:
        SymphonyOS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SymphonyOSTests
        - SymphonyOSUITests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
