<title>Paper Horizons</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Marcellus&display=swap">
<style>
/* Layout: a planner spread. Left edge: the level above, folded (what this period is for).
   Right edge: this period's calendar, folded (what is already claimed). A satin ribbon
   on the sheet runs the planning session across the same page — no second screen. */
:root {
  --sky: hsl(210 28% 95%);
  --sky-2: hsl(206 30% 91%);
  --paper: hsl(45 22% 99.4%);
  --paper-above: hsl(43 28% 96.6%);
  --paper-cal: hsl(205 26% 97.2%);
  --paper-back: hsl(40 14% 89%);
  --ink: hsl(215 30% 15%);
  --ink-soft: hsl(215 12% 38%);
  --ink-faint: hsl(215 10% 56%);
  --rule: hsl(215 18% 89%);
  --rule-above: hsl(38 18% 86%);
  --accent: hsl(215 30% 30%);
  --sage: hsl(150 34% 32%);
  --ribbon: hsl(352 42% 38%);
  --ribbon-hi: hsl(352 46% 48%);
  --ribbon-ink: hsl(30 40% 97%);
  --shadow: 215 32% 14%;
  --grain-alpha: .055;
  --f-display: 'Crimson Pro', Georgia, 'Times New Roman', serif;
  --f-brand: 'Marcellus', Georgia, serif;
  --f-sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: hsl(214 26% 9%); --sky-2: hsl(214 24% 12%);
    --paper: hsl(214 16% 15%); --paper-above: hsl(36 10% 17%); --paper-cal: hsl(205 16% 17%); --paper-back: hsl(214 12% 22%);
    --ink: hsl(210 22% 92%); --ink-soft: hsl(210 12% 72%); --ink-faint: hsl(210 8% 56%);
    --rule: hsl(214 14% 23%); --rule-above: hsl(36 8% 26%);
    --accent: hsl(212 45% 72%); --sage: hsl(150 30% 62%);
    --ribbon: hsl(352 38% 44%); --ribbon-hi: hsl(352 44% 54%); --ribbon-ink: hsl(30 40% 97%);
    --shadow: 220 40% 2%; --grain-alpha: .08; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: hsl(214 26% 9%); --sky-2: hsl(214 24% 12%);
  --paper: hsl(214 16% 15%); --paper-above: hsl(36 10% 17%); --paper-cal: hsl(205 16% 17%); --paper-back: hsl(214 12% 22%);
  --ink: hsl(210 22% 92%); --ink-soft: hsl(210 12% 72%); --ink-faint: hsl(210 8% 56%);
  --rule: hsl(214 14% 23%); --rule-above: hsl(36 8% 26%);
  --accent: hsl(212 45% 72%); --sage: hsl(150 30% 62%);
  --ribbon: hsl(352 38% 44%); --ribbon-hi: hsl(352 44% 54%); --ribbon-ink: hsl(30 40% 97%);
  --shadow: 220 40% 2%; --grain-alpha: .08; color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% -10%, var(--sky-2), var(--sky) 60%) fixed, var(--sky);
  color: var(--ink);
  font: 15px/1.5 var(--f-sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }

/* ---- top bar ---- */
.bar { max-width: 1180px; margin: 0 auto 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.brand { font-family: var(--f-brand); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-right: auto; }
.brand b { font-weight: 400; color: var(--ink); }
.horizons { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 70%, transparent); box-shadow: 0 1px 2px hsl(var(--shadow) / .08), inset 0 0 0 1px var(--rule); }
.horizons button { font: 500 13px/1 var(--f-sans); color: var(--ink-soft); background: none; border: 0; padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: color .2s, background .2s; }
.horizons button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px hsl(var(--shadow) / .14); }
:is(.horizons button, .icon-btn, .spine, .grip, .add input, .ribbon-tab, .band button, .rv button):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn { width: 36px; height: 36px; border-radius: 999px; border: 0; cursor: pointer; background: color-mix(in srgb, var(--paper) 70%, transparent); color: var(--ink-soft); box-shadow: inset 0 0 0 1px var(--rule); display: grid; place-items: center; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="false"] .wave { display: none; }
.icon-btn[aria-pressed="true"] .mute { display: none; }

/* ---- the ribbon band: the session, laid across the top of the page ---- */
.band-wrap { max-width: 1180px; margin: 0 auto; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s cubic-bezier(.2,.8,.2,1); }
.band-wrap.on { grid-template-rows: 1fr; }
.band-wrap > div { overflow: hidden; }
.band {
  position: relative; margin: 0 auto 16px; max-width: 980px;
  background: linear-gradient(180deg, var(--ribbon-hi), var(--ribbon) 55%);
  color: var(--ribbon-ink); border-radius: 4px;
  box-shadow: 0 1px 0 hsl(0 0% 100% / .18) inset, 0 8px 18px -10px hsl(var(--shadow) / .5);
  padding: 10px 16px 12px;
}
/* satin sheen: one soft highlight across the top, no fine texture behind the text */
.band::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  background: linear-gradient(180deg, hsl(0 0% 100% / .14) 0%, hsl(0 0% 100% / .04) 38%, transparent 60%, hsl(0 0% 0% / .06) 100%); }
.band > * { position: relative; }
.band-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.band-title { font: 500 12px/1 var(--f-sans); letter-spacing: .16em; text-transform: uppercase; opacity: .85; margin-right: 4px; white-space: nowrap; }
.steps { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; min-width: 0; }
.steps button {
  background: none; border: 0; cursor: pointer; color: inherit; opacity: .72;
  font: 500 12.5px/1 var(--f-sans); padding: 7px 9px; border-radius: 999px; display: flex; gap: 6px; align-items: center;
  transition: opacity .2s, background .2s;
}
.steps button .n { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; box-shadow: inset 0 0 0 1px hsl(0 0% 100% / .45); }
.steps button.done .n { background: hsl(0 0% 100% / .9); color: var(--ribbon); box-shadow: none; }
.steps button[aria-current="step"] { opacity: 1; background: hsl(0 0% 100% / .16); }
.steps button:hover { opacity: 1; }
.band-nav { display: flex; gap: 6px; margin-left: auto; }
.band-nav button { background: hsl(0 0% 100% / .14); border: 0; color: inherit; cursor: pointer; font: 500 12.5px/1 var(--f-sans); padding: 8px 12px; border-radius: 999px; }
.band-nav button.primary { background: var(--ribbon-ink); color: var(--ribbon); }
.band-note { margin-top: 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 13px; line-height: 1.45; }
.band-note b { font-weight: 600; opacity: .8; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; padding-top: 2px; }
.band-note span { opacity: .96; }

/* ---- stage & spread ---- */
.stage { max-width: 1180px; margin: 0 auto; display: flex; justify-content: center; }
.spread { --pL: 0; --pR: 0; display: flex; align-items: stretch; position: relative; }
.slot { --p: 0; position: relative; flex: none; width: 34px; perspective: 2200px; z-index: 1; }
.slot.left { perspective-origin: 100% 40%; }
.slot.right { perspective-origin: 0% 40%; }
.current { position: relative; z-index: 2; flex: none; }

.sheet { background-color: var(--paper); background-image: var(--grain); border-radius: 10px; }
.current {
  width: var(--cur, 520px);
  min-height: min(720px, 86vh);
  padding: 30px 38px 28px 40px;
  box-shadow: 0 1px 1px hsl(var(--shadow) / .06), 0 10px 30px -8px hsl(var(--shadow) / .18), 0 30px 60px -30px hsl(var(--shadow) / .22);
}
.current::before, .current::after { content: ""; position: absolute; top: 0; bottom: 0; width: 26px; pointer-events: none; }
.current::before { left: 0; background: linear-gradient(to right, hsl(var(--shadow) / .16), hsl(var(--shadow) / 0)); opacity: clamp(0, var(--pL), 1); border-radius: 10px 0 0 10px; }
.current::after { right: 0; background: linear-gradient(to left, hsl(var(--shadow) / .16), hsl(var(--shadow) / 0)); opacity: clamp(0, var(--pR), 1); border-radius: 0 10px 10px 0; }

/* folded edges */
.spine {
  position: absolute; top: 10px; bottom: 10px; border: 0; cursor: pointer; padding: 0;
  background-image: var(--grain);
  color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  opacity: clamp(0, calc(1 - var(--p) * 3.2), 1);
  touch-action: none; user-select: none; transition: filter .2s;
}
.spine:hover { filter: brightness(.97); }
.left .spine { left: 4px; right: 0; border-radius: 8px 0 0 8px; background-color: var(--paper-above);
  box-shadow: -1px 0 0 var(--rule-above), -4px 0 0 -1px var(--paper-above), -5px 0 0 -1px var(--rule-above), 0 8px 18px -10px hsl(var(--shadow) / .3); }
.right .spine { left: 0; right: 4px; border-radius: 0 8px 8px 0; background-color: var(--paper-cal);
  box-shadow: 1px 0 0 var(--rule), 4px 0 0 -1px var(--paper-cal), 5px 0 0 -1px var(--rule), 0 8px 18px -10px hsl(var(--shadow) / .3); }
.spine .lbl { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 11px/1 var(--f-sans); letter-spacing: .2em; text-transform: uppercase; white-space: nowrap; }
.right .spine .lbl { transform: none; }
.spine .cnt { font: 500 12px/1 var(--f-sans); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.spine svg { width: 14px; height: 14px; opacity: .7; }
.slot.is-open .spine { pointer-events: none; }
.spine.cue { animation: cue 1.4s ease-in-out 2; }
@keyframes cue { 50% { filter: brightness(.9); transform: translateX(var(--cue-x, -3px)); } }
.left .spine.cue { --cue-x: -4px; } .right .spine.cue { --cue-x: 4px; }

/* the sheets on their hinges */
.flap { position: absolute; top: 0; bottom: 0; width: 340px; transform-style: preserve-3d; will-change: transform; }
.left .flap { right: 0; transform-origin: 100% 50%; }
.right .flap { left: 0; transform-origin: 0% 50%; }
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; display: flex; flex-direction: column; }
.left .face { border-radius: 10px 3px 3px 10px; }
.right .face { border-radius: 3px 10px 10px 3px; }
.front { background-image: var(--grain); box-shadow: 0 10px 30px -10px hsl(var(--shadow) / .2); }
.left .front { background-color: var(--paper-above); }
.right .front { background-color: var(--paper-cal); }
.back { background-color: var(--paper-back); background-image: var(--grain); transform: rotateY(180deg); }
.front::after, .back::after { content: ""; position: absolute; inset: 0; pointer-events: none; }
.left .front::after, .left .back::after { background: linear-gradient(to left, hsl(var(--shadow) / .55), hsl(var(--shadow) / .12) 45%, hsl(var(--shadow) / 0)); }
.right .front::after, .right .back::after { background: linear-gradient(to right, hsl(var(--shadow) / .55), hsl(var(--shadow) / .12) 45%, hsl(var(--shadow) / 0)); }
.front::after { opacity: calc((1 - var(--p)) * .9 + .06); }
.back::after { opacity: .5; }
.front .scroll { overflow-y: auto; padding: 26px 28px 24px; flex: 1; scrollbar-width: thin; scrollbar-color: var(--rule-above) transparent; position: relative; z-index: 1; }
.grip { position: absolute; z-index: 3; cursor: grab; border: 0; background: none; padding: 0; touch-action: none; top: 0; bottom: 0; width: 16px; }
.left .grip { right: -6px; } .right .grip { left: -6px; }
.grip:active { cursor: grabbing; }
.grip::before { content: ""; position: absolute; top: 50%; left: 6px; width: 4px; height: 44px; margin-top: -22px; border-radius: 4px; background: var(--ink-faint); opacity: 0; transition: opacity .2s; }
.grip:hover::before, .grip:focus-visible::before { opacity: .35; }

/* ---- the ribbon tab: a bookmark hanging from the top of this sheet ---- */
.ribbon-tab {
  position: absolute; top: -6px; right: 54px; width: 30px; height: 86px; border: 0; padding: 0; cursor: pointer; z-index: 4;
  background: linear-gradient(90deg, var(--ribbon) 0%, var(--ribbon-hi) 50%, var(--ribbon) 100%);
  -webkit-font-smoothing: antialiased;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 84%, 0 100%);
  color: var(--ribbon-ink); filter: drop-shadow(0 4px 4px hsl(var(--shadow) / .25));
  transition: height .35s cubic-bezier(.2,1.4,.4,1), transform .2s;
}
.ribbon-tab span { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); writing-mode: vertical-rl; font: 600 10px/1 var(--f-sans); letter-spacing: .22em; text-transform: uppercase; }
.ribbon-tab:hover { height: 94px; }
.ribbon-tab[aria-expanded="true"] { height: 26px; }
.ribbon-tab[aria-expanded="true"] span { opacity: 0; }

/* ---- sheet contents ---- */
.kicker { font: 600 10.5px/1 var(--f-sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); }
.title { font: 500 40px/1.05 var(--f-display); letter-spacing: -.01em; margin: 10px 0 6px; text-wrap: balance; padding-right: 64px; }
.flap .title { font-size: 28px; margin-top: 8px; padding-right: 0; }
.meta { font-size: 13px; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.meta .planned { color: var(--ink-faint); }
.bar-progress { height: 3px; border-radius: 3px; background: var(--rule); margin: 14px 0 18px; overflow: hidden; }
.bar-progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s cubic-bezier(.2,.8,.2,1); }
.list { list-style: none; margin: 0; padding: 0; }
.list li { font: 400 18.5px/1.35 var(--f-display); padding: 9px 0 10px; border-bottom: 1px solid var(--rule); display: flex; gap: 12px; align-items: flex-start; }
.flap .list li { font-size: 16px; padding: 7px 0 8px; border-bottom-color: var(--rule-above); color: var(--ink-soft); }
.list li.new { animation: ink .6s ease-out; }
@keyframes ink { from { color: var(--accent); } }
.check { flex: none; width: 18px; height: 18px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--ink-faint); background: none; padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--paper); transition: background .18s, border-color .18s; }
.check svg { width: 11px; height: 11px; opacity: 0; transform: scale(.6); transition: opacity .18s, transform .25s cubic-bezier(.3,1.6,.5,1); }
li.done .check { background: var(--sage); border-color: var(--sage); }
li.done .check svg { opacity: 1; transform: none; }
li.done .txt { color: var(--ink-faint); text-decoration: line-through; }
.donefold { margin-top: 14px; font-size: 13px; color: var(--ink-faint); }
.empty { font: italic 400 17px/1.4 var(--f-display); color: var(--ink-faint); padding: 8px 0; }
.add { margin-top: 2px; display: flex; align-items: center; gap: 12px; color: var(--accent); border-bottom: 1px solid var(--rule); padding: 4px 0; border-radius: 4px; transition: box-shadow .4s, background .4s; }
.add svg { flex: none; width: 18px; height: 18px; }
.add input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: 400 18.5px/1.35 var(--f-display); padding: 6px 0; }
.add input::placeholder { color: var(--accent); opacity: .75; }
.add input:focus { outline: none; }
.add:focus-within { border-bottom-color: var(--accent); }
.add.glow { background: color-mix(in srgb, var(--accent) 7%, transparent); box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 7%, transparent); }
.add .enter { display: none; font: 500 11px/1 var(--f-sans); color: var(--ink-faint); white-space: nowrap; }
.add:focus-within .enter { display: inline; }
.reading { margin-top: 16px; font-size: 12px; color: var(--ink-faint); display: flex; gap: 6px; align-items: center; }
.reading svg { width: 14px; height: 14px; flex: none; }
.section-h { font: 600 10.5px/1 var(--f-sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); margin: 22px 0 4px; }

/* look-back sheet (inside a session only: the one place the sheet beside you has choices) */
.rv li { flex-wrap: wrap; }
.rv .txt { flex: 1 1 100%; color: var(--ink); }
.rv .choices { display: flex; gap: 4px; flex-wrap: wrap; }
.rv .choices button { border: 0; background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--ink-soft); font: 500 11.5px/1 var(--f-sans); padding: 6px 9px; border-radius: 999px; cursor: pointer; }
.rv .choices button[aria-pressed="true"] { background: var(--accent); color: var(--paper); }
.rv li.decided .txt { color: var(--ink-faint); }

/* calendar sheet */
.cal { width: 100%; border-collapse: collapse; margin: 6px 0 14px; table-layout: fixed; font-variant-numeric: tabular-nums; }
.cal th { font: 600 10px/1 var(--f-sans); letter-spacing: .1em; color: var(--ink-faint); padding: 6px 0; }
.cal td { height: 38px; vertical-align: top; padding: 4px 3px; border-top: 1px solid var(--rule); font: 500 12px/1 var(--f-sans); color: var(--ink-soft); position: relative; }
.cal td.out { color: transparent; }
.cal td.today { color: var(--accent); font-weight: 700; }
.cal td .dots { position: absolute; left: 3px; bottom: 5px; display: flex; gap: 3px; }
.cal td .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); opacity: .75; }
.cal td .dots i.fam { background: var(--ribbon); }
.claimed { list-style: none; margin: 0; padding: 0; }
.claimed li { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--rule); font: 400 15px/1.3 var(--f-display); color: var(--ink-soft); }
.claimed li b { font: 600 11px/1.6 var(--f-sans); color: var(--ink-faint); letter-spacing: .04em; }
.months { list-style: none; margin: 0; padding: 0; }
.months li { display: grid; grid-template-columns: 44px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--rule); font: 400 14.5px/1.3 var(--f-display); color: var(--ink-soft); }
.months li b { font: 600 10.5px/1.7 var(--f-sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
.months li.now b { color: var(--accent); }

/* planned stamp */
.stamp { position: absolute; top: 26px; right: 104px; width: 92px; height: 92px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  border: 2px solid var(--sage); color: var(--sage); font: 600 10px/1.25 var(--f-sans); letter-spacing: .14em; text-transform: uppercase;
  transform: rotate(-12deg) scale(1); opacity: .82; pointer-events: none; }
.stamp.hit { animation: stamp .42s cubic-bezier(.2,1.6,.4,1); }
@keyframes stamp { from { transform: rotate(-12deg) scale(1.6); opacity: 0; } }

.hint { max-width: 1000px; margin: 22px auto 0; text-align: center; color: var(--ink-faint); font-size: 13px; }
.hint kbd { font: 500 11px/1 var(--f-sans); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--ink-soft); background: var(--paper); }
.swap { animation: swap .42s cubic-bezier(.2,.7,.2,1); }
@keyframes swap { from { opacity: 0; transform: translateY(6px); } }

/* ---- phones: the level above hangs from the top edge, the calendar from the bottom ---- */
body.v .spread { flex-direction: column; width: 100%; }
body.v .stage { display: block; }
body.v .slot { width: auto; height: 46px; }
body.v .slot.left { perspective-origin: 50% 100%; }
body.v .slot.right { perspective-origin: 50% 0%; }
body.v .current { width: 100%; min-height: 0; padding: 24px 20px 22px; border-radius: 3px; }
body.v .current::before { inset: 0 0 auto 0; width: auto; height: 22px; background: linear-gradient(to bottom, hsl(var(--shadow) / .14), transparent); }
body.v .current::after { inset: auto 0 0 0; width: auto; height: 22px; background: linear-gradient(to top, hsl(var(--shadow) / .14), transparent); }
body.v .spine { flex-direction: row; gap: 10px; }
body.v .left .spine { inset: 4px 8px 0 8px; border-radius: 10px 10px 0 0; box-shadow: 0 -1px 0 var(--rule-above), 0 -4px 0 -1px var(--paper-above), 0 -5px 0 -1px var(--rule-above); }
body.v .right .spine { inset: 0 8px 4px 8px; border-radius: 0 0 10px 10px; box-shadow: 0 1px 0 var(--rule), 0 4px 0 -1px var(--paper-cal), 0 5px 0 -1px var(--rule); }
body.v .spine .lbl { writing-mode: horizontal-tb; transform: none; }
body.v .left .spine svg { transform: rotate(90deg); }
body.v .right .spine svg { transform: rotate(-90deg); }
body.v .flap { left: 0; right: 0; width: auto; height: 300px; }
body.v .left .flap { top: auto; bottom: 0; transform-origin: 50% 100%; }
body.v .right .flap { top: 0; bottom: auto; transform-origin: 50% 0%; }
body.v .left .face { border-radius: 12px 12px 3px 3px; }
body.v .right .face { border-radius: 3px 3px 12px 12px; }
body.v .back { transform: rotateX(180deg); }
body.v .left .front::after, body.v .left .back::after { background: linear-gradient(to top, hsl(var(--shadow) / .55), hsl(var(--shadow) / .12) 45%, transparent); }
body.v .right .front::after, body.v .right .back::after { background: linear-gradient(to bottom, hsl(var(--shadow) / .55), hsl(var(--shadow) / .12) 45%, transparent); }
body.v .front .scroll { padding: 22px 20px 18px; }
body.v .grip { left: 0; right: 0; top: auto; bottom: auto; width: auto; height: 16px; }

  }
  const L = makeFold('left'), R = makeFold('right');
  // Only one companion at a time unless the spread has room for three pages.
  L.onOpen = () => { if (!both && R.target === 1) R.go(0, true); };
  R.onOpen = () => { if (!both && L.target === 1) L.go(0, true); };

  // ---------- rendering ----------
  const eye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  let leftView = 'above';
  function rowsHtml(key, opts = {}) {
    const Lv = LEVELS[key]; const items = [...Lv.items, ...added[key]];
    return items.map((t, i) => {
      const id = key + ':' + t; const isNew = i >= Lv.items.length && opts.fresh === t;
      if (opts.doing) { const d = ticked.has(id); return `<li class="${d ? 'done' : ''}${isNew ? ' new' : ''}" data-id="${esc(id)}"><button type="button" class="check" aria-pressed="${d}" aria-label="Done: ${esc(t)}"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.6l4.6-5.2"/></svg></button><span class="txt">${esc(t)}</span></li>`; }
      return `<li class="${isNew ? 'new' : ''}"><span class="txt">${esc(t)}</span></li>`;
    }).join('');
  }
  function renderCurrent(fresh) {
    const Lv = LEVELS[level];
    const items = Lv.items.length + added[level].length;
    const doneNow = Lv.done + [...ticked].filter((x) => x.startsWith(level + ':')).length;
    const openCount = items - (doneNow - Lv.done);
    const plannedLine = planned[level] || Lv.planned;
    const step = session && STEPS[level][session.i];
    const ph = step && step.write === 'fun' ? `Something fun for ${Lv.short === 'This week' ? 'this week' : Lv.short}` : Lv.add;
    current.innerHTML = `
      <button type="button" class="ribbon-tab" id="ribbonTab" aria-expanded="${!!session}" aria-controls="band" aria-label="Plan ${esc(Lv.name)}"><span>Plan</span></button>
      ${planned[level] ? '<div class="stamp" id="stamp">Planned<br>' + esc(planned[level].split(',')[0].replace('Planned ', '')) + '</div>' : ''}
      <div class="kicker">${esc(Lv.kicker)}</div>
      <h1 class="title">${esc(Lv.name)}</h1>
      <div class="meta"><span>${openCount} open · ${doneNow} done</span><span class="planned">${esc(plannedLine)}</span></div>
      <div class="bar-progress" aria-hidden="true"><i style="width:${Math.round(doneNow / (items + Lv.done) * 100)}%"></i></div>
      <ul class="list">${rowsHtml(level, { doing: !!Lv.doing, fresh })}</ul>
      <form class="add" id="addForm" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="m14.5 5.5 3 3"/></svg>
        <input id="addInput" placeholder="${esc(ph)}" aria-label="${esc(ph)}"><span class="enter">Return to add</span></form>
      ${Lv.done ? `<div class="donefold">${Lv.done} done earlier${Lv.doneNames ? ' · ' + esc(Lv.doneNames) : ''}</div>` : ''}`;
    $('addForm').addEventListener('submit', (e) => { e.preventDefault(); const v = $('addInput').value.trim(); if (!v) return; added[level].push(v); Sound.pencil(); renderCurrent(v); const inp = $('addInput'); inp && inp.focus(); });
    $('ribbonTab').addEventListener('click', () => session ? leaveSession() : startSession());
  }
  function renderLeft() {
    const sp = $('spineLLbl'), cnt = $('spineLCnt');
    if (leftView === 'look') {
      const lb = LOOKBACK[level];
      sp.textContent = lb.name; cnt.textContent = String(lb.items.length);
      const dest = { year: 'To 2027', season: 'To Fall', month: 'To November' }[level];
      const choices = level === 'week' ? ['Done', 'Next week', 'Someday', 'Let go'] : ['Done', dest, 'Someday', 'Let go'];
      $('bodyL').innerHTML = `<div class="kicker">Looking back</div><h2 class="title">${esc(lb.name)}</h2>
        ${lb.items.length ? `<ul class="list rv">${lb.items.map((t) => { const d = decisions[level + ':' + t]; return `<li class="${d ? 'decided' : ''}" data-t="${esc(t)}"><span class="txt">${esc(t)}</span><span class="choices">${choices.map((c) => `<button type="button" aria-pressed="${d === c}">${c}</button>`).join('')}</span></li>`; }).join('')}</ul>` : `<p class="empty">Nothing left open from ${esc(lb.name)}.</p>`}
        <div class="reading">Only here, while planning, does the sheet beside you take a choice. Each one acts on ${esc(lb.name)} only.</div>`;
      return;
    }
    const k = ABOVE[level];
    if (!k) { sp.textContent = '2025'; cnt.textContent = '0'; $('bodyL').innerHTML = `<div class="kicker">Last year</div><h2 class="title">2025</h2><p class="empty">Nothing left open from 2025.</p><div class="reading">${eye} For reading.</div>`; return; }
    const A = LEVELS[k]; const n = A.items.length + added[k].length;
    sp.textContent = A.name; cnt.textContent = String(n);
    const word = level === 'week' ? 'this week' : LEVELS[level].short;
    $('bodyL').innerHTML = `<div class="kicker">${esc(A.kicker)}</div><h2 class="title">${esc(A.name)}</h2><ul class="list">${rowsHtml(k)}</ul>${A.done ? `<div class="donefold">${A.done} done</div>` : ''}<div class="reading">${eye} For reading. Write ${esc(word)} in its own words.</div>`;
  }
  function renderRight() {
    const has = level !== 'week';
    $('slotR').hidden = !has;
    if (!has) return;
    const lbl = { year: '2026 calendar', season: 'Fall calendar', month: 'November calendar' }[level];
    $('spineRLbl').textContent = lbl;
    if (level === 'month') {
      const days = ['S', 'M', 'T', 'W', 'T', 'F', 'S']; let cells = '', d = 1 - 0; // Nov 1 2026 is a Sunday
      for (let wk = 0; wk < 5; wk++) { cells += '<tr>'; for (let i = 0; i < 7; i++, d++) { const ev = NOV.filter((e) => e.d === d); const inMonth = d >= 1 && d <= 30; cells += `<td class="${inMonth ? '' : 'out'}${d === 4 ? ' today' : ''}">${inMonth ? d : ''}${ev.length ? `<span class="dots">${ev.slice(0, 3).map((e) => `<i class="${e.fam ? 'fam' : ''}"></i>`).join('')}</span>` : ''}</td>`; } cells += '</tr>'; }
      const claimed = NOV.filter((e, i, a) => !e.t.startsWith('Boxing') || a.findIndex((x) => x.t.startsWith('Boxing')) === i);
      $('bodyR').innerHTML = `<div class="kicker">What’s already claimed</div><h2 class="title">November</h2>
        <table class="cal" aria-label="November 2026"><thead><tr>${days.map((x) => `<th>${x}</th>`).join('')}</tr></thead><tbody>${cells}</tbody></table>
        <ul class="claimed">${claimed.map((e) => `<li><b>Nov ${e.d}</b><span>${esc(e.t.startsWith('Boxing') ? 'Boxing, Tue and Thu 9a' : e.t)}</span></li>`).join('')}</ul>
        <div class="reading">${eye} For reading. Add events the usual way.</div>`;
    } else if (level === 'season') {
      $('bodyR').innerHTML = `<div class="kicker">Fixed dates · Oct 1 – Dec 31</div><h2 class="title">Fall</h2>
        <ul class="months"><li><b>Oct</b><span>Halloween, Oct 31</span></li><li class="now"><b>Nov</b><span>Election Day, no school (3) · No school (6) · Thanksgiving (26) · Ella and Kaleb turn 9 (28)</span></li><li><b>Dec</b><span>Winter break (example) · Winter vacation, dates pending</span></li></ul>
        <div class="reading">${eye} For reading.</div>`;
    } else {
      const ms = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      const notes = { Oct: 'Halloween', Nov: 'Thanksgiving · Ella and Kaleb turn 9', Dec: 'Winter vacation (pending)' };
      $('bodyR').innerHTML = `<div class="kicker">The 12 months</div><h2 class="title">2026</h2>
        <ul class="months">${ms.map((m) => `<li class="${m === 'Nov' ? 'now' : ''}"><b>${m}</b><span>${esc(notes[m] || '')}</span></li>`).join('')}</ul>
        <div class="reading">${eye} For reading.</div>`;
    }
  }

  current.addEventListener('click', (e) => {
    const b = e.target.closest('.check'); if (!b) return;
    const li = b.closest('li'); const id = li.dataset.id;
    if (ticked.has(id)) ticked.delete(id); else { ticked.add(id); Sound.pencil(); buzz(); }
    renderCurrent();
  });
  $('bodyL').addEventListener('click', (e) => {
    const b = e.target.closest('.choices button'); if (!b) return;
    const t = b.closest('li').dataset.t; decisions[level + ':' + t] = b.textContent; Sound.pencil(); renderLeft();
  });

  // ---------- geometry ----------
  function layout() {
    const was = mode; mode = detectMode();
    document.body.classList.toggle('v', mode === 'v'); document.body.classList.toggle('h', mode !== 'v'); document.body.classList.toggle('duo', mode === 'duo');
    const hasR = level !== 'week';
    for (const f of [L, R]) { f.flap.style.height = ''; f.flap.style.width = ''; }
    if (mode === 'v') {
      both = false;
      for (const f of [L, R]) {
        f.edge = 46; f.flap.style.height = 'auto';
        const inner = f.body.scrollHeight; f.H = Math.min(inner + 2, Math.round(innerHeight * .62)); f.flap.style.height = f.H + 'px';
      }
      document.documentElement.style.setProperty('--cur', '100%');
    } else if (mode === 'duo') {
      both = false;
      const avail = Math.min(innerWidth, forceDuo ? 640 : innerWidth) - 20;
      const comp = Math.floor(avail * .38);
      L.edge = R.edge = 22; L.W = R.W = comp;
      document.documentElement.style.setProperty('--cur', (avail - comp - (hasR ? 22 : 0)) + 'px');
    } else {
      const avail = Math.min(1180, innerWidth - 32);
      const comp = Math.round(Math.min(320, Math.max(220, avail * .26)));
      L.edge = R.edge = 34; L.W = R.W = comp;
      const curBoth = avail - 2 * comp;
      both = hasR && curBoth >= 420;
      const cur = both ? Math.min(560, curBoth) : Math.min(560, avail - comp - (hasR ? 34 : 0));
      document.documentElement.style.setProperty('--cur', cur + 'px');
    }
    for (const f of [L, R]) f.flap.style.width = mode === 'v' ? '' : f.W + 'px';
    if (was && was !== mode && mode === 'duo') { L.apply(L.p); R.apply(R.p); L.go(1); return; }
    if (was === 'duo' && mode !== 'duo') { for (const f of [L, R]) { f.p = f.target = f.v = 0; } }
    if (!both && L.target === 1 && R.target === 1) { R.p = R.target = 0; }
    L.apply(L.p); R.apply(R.p);
  }

  addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLInputElement || e.metaKey || e.ctrlKey || e.altKey || e.repeat) return;
    if (e.key === 'f' || e.key === 'F') L.toggle();
    if ((e.key === 'c' || e.key === 'C') && level !== 'week') R.toggle();
  });

  // ---------- the ribbon: planning, on the same page ----------
  let session = null;
  const bandWrap = $('bandWrap');
  function startSession() {
    session = { i: 0, done: new Set() };
    Sound.ribbon();
    bandWrap.classList.add('on');
    renderBand(); applyStep(); renderCurrent();
  }
  function leaveSession() {
    session = null; Sound.ribbon(); bandWrap.classList.remove('on');
    leftView = 'above'; renderLeft(); renderCurrent();
  }
  function renderBand() {
    const Lv = LEVELS[level], steps = STEPS[level];
    $('bandTitle').textContent = 'Plan ' + (level === 'week' ? 'the week' : Lv.short === '2026' ? '2026' : Lv.short);
    $('steps').innerHTML = steps.map((s, i) => `<button type="button" data-i="${i}" class="${session.done.has(i) ? 'done' : ''}" ${i === session.i ? 'aria-current="step"' : ''}><span class="n">${session.done.has(i) ? '✓' : i + 1}</span>${esc(s.t)}</button>`).join('');
    const s = steps[session.i];
    $('bandNote').innerHTML = `<b>Why</b><span>${esc(s.why)}</span><b>You</b><span>${esc(s.you)}</span>`;
    $('bandBack').disabled = session.i === 0;
    const last = session.i === steps.length - 1;
    $('bandNext').textContent = last ? 'Done planning ' + (level === 'week' ? 'the week' : Lv.short) : 'Next';
  }
  function applyStep() {
    const s = STEPS[level][session.i];
    const wantL = s.left ? 1 : 0, wantR = s.right ? 1 : 0;
    const newView = s.left === 'look' ? 'look' : 'above';
    if (newView !== leftView) { leftView = newView; renderLeft(); if (mode === 'v') layout(); }
    // Open what this step needs; fold what it doesn't. On a narrow spread, one at a time.
    if (wantR && !both) { L.go(0, true); R.go(1); }
    else { if (L.target !== wantL) L.go(wantL); if (R.target !== wantR) R.go(wantR); }
    const sp = wantL ? L.spine : wantR ? R.spine : null;
    if (s.write) {
      requestAnimationFrame(() => { const a = $('addForm'); if (!a) return; a.classList.add('glow'); $('addInput').focus({ preventScroll: true }); setTimeout(() => a.classList.remove('glow'), 1400); });
    }
  }
  $('steps').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b || !session) return; session.i = +b.dataset.i; Sound.crinkle(3, .1, .6); renderBand(); renderCurrent(); applyStep(); });
  $('bandBack').addEventListener('click', () => { if (session && session.i > 0) { session.i--; Sound.crinkle(3, .1, .6); renderBand(); renderCurrent(); applyStep(); } });
  $('bandLeave').addEventListener('click', leaveSession);
  $('bandNext').addEventListener('click', () => {
    if (!session) return;
    const steps = STEPS[level];
    session.done.add(session.i);
    if (session.i < steps.length - 1) { session.i++; Sound.crinkle(3, .1, .6); renderBand(); renderCurrent(); applyStep(); return; }
    // Done planning: fold everything, stamp the sheet.
    planned[level] = 'Planned Wed, Nov 4' + (level === 'year' ? '' : ' · Last ' + (level === 'week' ? 'week' : level === 'month' ? 'month' : 'season') + '’s review');
    session = null; bandWrap.classList.remove('on'); leftView = 'above'; renderLeft();
    L.go(0, true); R.go(0, true);
    renderCurrent();
    const st = $('stamp'); if (st) { st.classList.add('hit'); setTimeout(() => { Sound.stamp(); buzz(); }, 120); }
  });

  // ---------- horizons ----------
  const tabs = document.querySelectorAll('.horizons button');
  function setLevel(k) {
    if (session) { session = null; bandWrap.classList.remove('on'); }
    level = k; leftView = 'above';
    tabs.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.h === k)));
    renderCurrent(); renderLeft(); renderRight();
    current.classList.remove('swap'); void current.offsetWidth; current.classList.add('swap');
    if (k === 'week') { R.p = R.target = 0; }
    layout();
    try { history.replaceState(null, '', '#' + k + (forceDuo ? '-duo' : '')); } catch (e) {}
  }
  tabs.forEach((b) => b.addEventListener('click', () => { if (b.dataset.h !== level) { Sound.crinkle(4, .14, .7); setLevel(b.dataset.h); } }));
  let rt = 0; addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });
  setLevel(level);
})();
</script>
