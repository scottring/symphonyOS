<style>
/* Layout: one journal spread. The sheet above is hinged to the left edge of this period's sheet
   (the top edge on phones). Folded, only its edge shows; unfolded, it lies beside the page, for reading only. */
:root {
  --sky: hsl(210 28% 95%);
  --sky-2: hsl(206 30% 91%);
  --paper: hsl(45 22% 99.4%);
  --paper-above: hsl(43 28% 96.6%);
  --paper-back: hsl(40 14% 89%);
  --ink: hsl(215 30% 15%);
  --ink-soft: hsl(215 12% 38%);
  --ink-faint: hsl(215 10% 56%);
  --rule: hsl(215 18% 89%);
  --rule-above: hsl(38 18% 86%);
  --accent: hsl(215 30% 30%);
  --sage: hsl(150 34% 32%);
  --shadow: 215 32% 14%;
  --grain-alpha: .055;
  --f-display: 'Crimson Pro', Georgia, 'Times New Roman', serif;
  --f-brand: 'Marcellus', Georgia, serif;
  --f-sans: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: hsl(214 26% 9%);
    --sky-2: hsl(214 24% 12%);
    --paper: hsl(214 16% 15%);
    --paper-above: hsl(36 10% 17%);
    --paper-back: hsl(214 12% 22%);
    --ink: hsl(210 22% 92%);
    --ink-soft: hsl(210 12% 72%);
    --ink-faint: hsl(210 8% 56%);
    --rule: hsl(214 14% 23%);
    --rule-above: hsl(36 8% 26%);
    --accent: hsl(212 45% 72%);
    --sage: hsl(150 30% 62%);
    --shadow: 220 40% 2%;
    --grain-alpha: .08;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: hsl(214 26% 9%);
  --sky-2: hsl(214 24% 12%);
  --paper: hsl(214 16% 15%);
  --paper-above: hsl(36 10% 17%);
  --paper-back: hsl(214 12% 22%);
  --ink: hsl(210 22% 92%);
  --ink-soft: hsl(210 12% 72%);
  --ink-faint: hsl(210 8% 56%);
  --rule: hsl(214 14% 23%);
  --rule-above: hsl(36 8% 26%);
  --accent: hsl(212 45% 72%);
  --sage: hsl(150 30% 62%);
  --shadow: 220 40% 2%;
  --grain-alpha: .08;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background: radial-gradient(120% 70% at 50% -10%, var(--sky-2), var(--sky) 60%) fixed, var(--sky);
  color: var(--ink);
  font: 15px/1.5 var(--f-sans);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 40px;
  -webkit-font-smoothing: antialiased;
}

/* ---- top bar ---- */
.bar {
  max-width: 1000px; margin: 0 auto 26px;
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand { font-family: var(--f-brand); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-soft); margin-right: auto; }
.brand b { font-weight: 400; color: var(--ink); }
.horizons { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: color-mix(in srgb, var(--paper) 70%, transparent); box-shadow: 0 1px 2px hsl(var(--shadow) / .08), inset 0 0 0 1px var(--rule); }
.horizons button {
  font: 500 13px/1 var(--f-sans); color: var(--ink-soft); background: none; border: 0;
  padding: 8px 14px; border-radius: 999px; cursor: pointer; transition: color .2s, background .2s;
}
.horizons button[aria-pressed="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 3px hsl(var(--shadow) / .14); }
.horizons button:focus-visible, .icon-btn:focus-visible, .spine:focus-visible, .grip:focus-visible, .add input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.icon-btn {
  width: 36px; height: 36px; border-radius: 999px; border: 0; cursor: pointer;
  background: color-mix(in srgb, var(--paper) 70%, transparent); color: var(--ink-soft);
  box-shadow: inset 0 0 0 1px var(--rule); display: grid; place-items: center;
}
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn[aria-pressed="false"] .wave { display: none; }
.icon-btn[aria-pressed="true"] .mute { display: none; }

/* ---- stage & spread ---- */
.stage { max-width: 1000px; margin: 0 auto; display: flex; justify-content: center; }
.spread { --p: 0; display: flex; align-items: stretch; position: relative; }
.slot { position: relative; flex: none; width: 34px; perspective: 2200px; perspective-origin: 100% 40%; z-index: 1; }
.current { position: relative; z-index: 2; flex: none; }

.sheet {
  background-color: var(--paper);
  background-image: var(--grain);
  border-radius: 3px 10px 10px 3px;
}
.current {
  width: var(--cur, min(560px, calc(100vw - 32px - 34px)));
  min-height: min(720px, 86vh);
  padding: 30px 38px 28px 40px;
  box-shadow: 0 1px 1px hsl(var(--shadow) / .06), 0 10px 30px -8px hsl(var(--shadow) / .18), 0 30px 60px -30px hsl(var(--shadow) / .22);
}
/* the crease where the sheet above is hinged */
.current::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 26px; pointer-events: none;
  background: linear-gradient(to right, hsl(var(--shadow) / .16), hsl(var(--shadow) / 0));
  opacity: clamp(0, var(--p), 1); border-radius: 3px 0 0 3px;
}

/* the folded edge of the sheet above */
.spine {
  position: absolute; inset: 10px 0 10px 4px; border: 0; cursor: pointer; padding: 0;
  background-color: var(--paper-above); background-image: var(--grain);
  border-radius: 8px 0 0 8px;
  box-shadow: -1px 0 0 var(--rule-above), -4px 0 0 -1px var(--paper-above), -5px 0 0 -1px var(--rule-above), 0 8px 18px -10px hsl(var(--shadow) / .3);
  color: var(--ink-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  opacity: clamp(0, calc(1 - var(--p) * 3.2), 1);
  pointer-events: auto; touch-action: none; user-select: none;
  transition: background-color .2s;
}
.spine:hover { background-color: color-mix(in srgb, var(--paper-above) 80%, var(--sky-2)); }
.spine .lbl { writing-mode: vertical-rl; transform: rotate(180deg); font: 600 11px/1 var(--f-sans); letter-spacing: .2em; text-transform: uppercase; }
.spine .cnt { font: 500 12px/1 var(--f-sans); color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.spine .chev { width: 14px; height: 14px; opacity: .7; }
.spread.is-open .spine { pointer-events: none; }

/* the sheet above, on its hinge */
.flap {
  position: absolute; top: 0; bottom: 0; right: 0; width: 340px;
  transform-origin: 100% 50%; transform-style: preserve-3d;
  will-change: transform;
}
.face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 10px 3px 3px 10px; overflow: hidden; }
.front {
  background-color: var(--paper-above); background-image: var(--grain);
  box-shadow: 0 10px 30px -10px hsl(var(--shadow) / .2);
  display: flex; flex-direction: column;
}
.back { background-color: var(--paper-back); background-image: var(--grain); transform: rotateY(180deg); }
/* light falling across the sheet as it turns; deepest at the hinge */
.front::after, .back::after {
  content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to left, hsl(var(--shadow) / .55), hsl(var(--shadow) / .12) 45%, hsl(var(--shadow) / 0));
}
.front::after { opacity: calc((1 - var(--p)) * .9 + .06); }
.back::after { opacity: .5; }
.front .scroll { overflow-y: auto; padding: 26px 30px 24px 30px; flex: 1; scrollbar-width: thin; scrollbar-color: var(--rule-above) transparent; }

.grip {
  position: absolute; z-index: 3; cursor: grab; border: 0; background: none; padding: 0;
  touch-action: none;
}
.grip:active { cursor: grabbing; }
.h .grip { top: 0; bottom: 0; right: -6px; width: 16px; }
.grip::before { content: ""; position: absolute; border-radius: 4px; background: var(--ink-faint); opacity: 0; transition: opacity .2s; }
.h .grip::before { top: 50%; left: 6px; width: 4px; height: 44px; margin-top: -22px; }
.grip:hover::before, .grip:focus-visible::before { opacity: .35; }

/* ---- sheet contents ---- */
.kicker { font: 600 10.5px/1 var(--f-sans); letter-spacing: .16em; text-transform: uppercase; color: var(--ink-faint); display: flex; align-items: center; gap: 8px; }
.kicker .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: .6; }
.title { font: 500 40px/1.05 var(--f-display); letter-spacing: -.01em; margin: 10px 0 6px; text-wrap: balance; }
.flap .title { font-size: 28px; margin-top: 8px; }
.meta { font-size: 13px; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.meta .planned { color: var(--ink-faint); }
.meta a { color: inherit; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.bar-progress { height: 3px; border-radius: 3px; background: var(--rule); margin: 14px 0 18px; overflow: hidden; }
.bar-progress i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .6s cubic-bezier(.2,.8,.2,1); }

.list { list-style: none; margin: 0; padding: 0; }
.list li {
  font: 400 18.5px/1.35 var(--f-display); padding: 9px 0 10px; border-bottom: 1px solid var(--rule);
  display: flex; gap: 12px; align-items: flex-start;
}
.flap .list li { font-size: 16px; padding: 7px 0 8px; border-bottom-color: var(--rule-above); color: var(--ink-soft); }
.list li.new { animation: ink .6s ease-out; }
@keyframes ink { from { color: var(--accent); } }
.check {
  flex: none; width: 18px; height: 18px; margin-top: 3px; border-radius: 50%; border: 1.5px solid var(--ink-faint);
  background: none; padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--paper);
  transition: background .18s, border-color .18s;
}
.check svg { width: 11px; height: 11px; opacity: 0; transform: scale(.6); transition: opacity .18s, transform .25s cubic-bezier(.3,1.6,.5,1); }
li.done .check { background: var(--sage); border-color: var(--sage); }
li.done .check svg { opacity: 1; transform: none; }
li.done .txt { color: var(--ink-faint); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--ink-faint) 60%, transparent); }
.donefold { margin-top: 14px; font-size: 13px; color: var(--ink-faint); }
.empty { font: italic 400 17px/1.4 var(--f-display); color: var(--ink-faint); padding: 8px 0; }

/* the next blank line on the sheet: where this period is written */
.add { margin-top: 2px; display: flex; align-items: center; gap: 12px; color: var(--accent); border-bottom: 1px solid var(--rule); padding: 4px 0; position: relative; }
.add svg { flex: none; width: 18px; height: 18px; }
.add input {
  flex: 1; min-width: 0; border: 0; background: none; color: var(--ink);
  font: 400 18.5px/1.35 var(--f-display); padding: 6px 0; border-radius: 0;
}
.add input::placeholder { color: var(--accent); opacity: .75; }
.add input:focus { outline: none; }
.add:focus-within { border-bottom-color: var(--accent); }
.add .enter { display: none; font: 500 11px/1 var(--f-sans); color: var(--ink-faint); white-space: nowrap; }
.add:focus-within .enter { display: inline; }
.donefold { order: 9; }

.reading { margin-top: 16px; font-size: 12px; color: var(--ink-faint); display: flex; gap: 6px; align-items: center; }
.reading svg { width: 14px; height: 14px; }

.hint { max-width: 1000px; margin: 22px auto 0; text-align: center; color: var(--ink-faint); font-size: 13px; }
.hint kbd { font: 500 11px/1 var(--f-sans); border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; color: var(--ink-soft); background: var(--paper); }

/* swap of horizons: a quiet page turn */
.swap { animation: swap .42s cubic-bezier(.2,.7,.2,1); }
@keyframes swap { from { opacity: 0; transform: translateY(6px); } }

/* ---- phones: the sheet above folds down from the top edge ---- */
.v .spread { flex-direction: column; align-items: stretch; width: 100%; }
.v .stage { display: block; }
.v .slot { width: auto; height: 46px; perspective-origin: 50% 100%; }
.v .current { width: 100%; min-height: 0; padding: 24px 20px 22px; border-radius: 3px 3px 12px 12px; }
.v .current::before { inset: 0 0 auto 0; width: auto; height: 22px; background: linear-gradient(to bottom, hsl(var(--shadow) / .14), hsl(var(--shadow) / 0)); border-radius: 3px 3px 0 0; }
.v .spine { inset: 4px 8px 0 8px; border-radius: 10px 10px 0 0; flex-direction: row; gap: 10px; box-shadow: 0 -1px 0 var(--rule-above), 0 -4px 0 -1px var(--paper-above), 0 -5px 0 -1px var(--rule-above); }
.v .spine .lbl { writing-mode: horizontal-tb; transform: none; }
.v .spine .chev { transform: rotate(90deg); }
.v .flap { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 300px; transform-origin: 50% 100%; }
.v .face { border-radius: 12px 12px 3px 3px; }
.v .back { transform: rotateX(180deg); }
.v .front::after, .v .back::after { background: linear-gradient(to top, hsl(var(--shadow) / .55), hsl(var(--shadow) / .12) 45%, hsl(var(--shadow) / 0)); }
.v .front .scroll { padding: 22px 20px 18px; }
.v .grip { left: 0; right: 0; bottom: -6px; height: 16px; }
.v .grip::before { left: 50%; top: 6px; height: 4px; width: 44px; margin-left: -22px; }
.v .title { font-size: 34px; }

/* ---- iPhone Duo, open: the phone's hinge is the page's crease. Left half: the sheet above. Right half: this period. ---- */
body.duo { padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-block: 10px 14px; }
.duo .bar { margin-bottom: 12px; gap: 10px; }
.duo .brand { font-size: 12px; }
.duo .horizons button { padding: 7px 11px; }
.duo .stage { max-width: none; }
.duo .current { width: var(--half); min-height: calc(100vh - 92px); padding: 22px 22px 20px 24px; border-radius: 2px 12px 12px 2px; }
.duo .face { border-radius: 12px 2px 2px 12px; }
.duo .title { font-size: 31px; }
.duo .flap .title { font-size: 25px; }
.duo .list li { font-size: 16.5px; padding: 8px 0 9px; }
.duo .flap .list li { font-size: 14.5px; padding: 6px 0 7px; }
.duo .front .scroll { padding: 22px 18px 20px 22px; }
.duo .spine { inset: 14px 0 14px 2px; }
.duo .spine .cnt { display: none; }
.duo .hint { margin-top: 10px; font-size: 12px; }
.duo .hint .wide { display: none; }
.hint .duo-only { display: none; }
.duo .hint .duo-only { display: inline; }

@media (prefers-reduced-motion: reduce) {
  .swap, .list li.new { animation: none; }
}
</style>

<header class="bar">
  <div class="brand"><b>Symphony</b> · paper-style horizons</div>
  <nav class="horizons" aria-label="Horizon">
    <button type="button" data-h="year" aria-pressed="false">Year</button>
    <button type="button" data-h="season" aria-pressed="false">Season</button>
    <button type="button" data-h="month" aria-pressed="true">Month</button>
    <button type="button" data-h="week" aria-pressed="false">Week</button>
  </nav>
  <button type="button" class="icon-btn" id="sound" aria-pressed="true" aria-label="Paper sounds" title="Paper sounds">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M11 5 6 9H3v6h3l5 4z"/>
      <path class="wave" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
      <path class="mute" d="m16 9 5 6m0-6-5 6"/>
    </svg>
  </button>
</header>

<main class="stage" id="stage">
  <div class="spread" id="spread">
    <div class="slot" id="slot">
      <button type="button" class="spine" id="spine" aria-expanded="false" aria-controls="flap">
        <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>
        <span class="lbl" id="spineLbl">Fall 2026</span>
        <span class="cnt" id="spineCnt">17</span>
      </button>
      <div class="flap" id="flap">
        <section class="face front" id="front" aria-label="The level above, for reading">
          <div class="scroll" id="aboveBody"></div>
        </section>
        <div class="face back" aria-hidden="true"></div>
        <button type="button" class="grip" id="grip" aria-label="Fold the sheet away"></button>
      </div>
    </div>
    <article class="sheet current" id="current"></article>
  </div>
</main>
<p class="hint" id="hint"><span class="wide">Tap the folded edge, or drag it open. <kbd>F</kbd> folds and unfolds. </span><span class="duo-only">Open your phone and the sheet above opens with it: the hinge is the crease. Close it and it folds away. </span>Nothing here saves.</p>

<script>

  const ABOVE = { year: null, season: 'year', month: 'season', week: 'month' };

  const ticked = new Set();

  const $ = (id) => document.getElementById(id);
  const spread = $('spread'), slot = $('slot'), flap = $('flap'), spine = $('spine'), grip = $('grip');
  const current = $('current'), aboveBody = $('aboveBody'), front = $('front');
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  // ---------- paper grain ----------
  try {
    const c = document.createElement('canvas'); c.width = c.height = 180;
    const g = c.getContext('2d'); const img = g.createImageData(180, 180);
    for (let i = 0; i < img.data.length; i += 4) {
      const v = 120 + Math.random() * 135; img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
      img.data[i + 3] = Math.random() < .5 ? 255 * (Math.random() * .9) : 0;
    }
    g.putImageData(img, 0, 0);
    const alpha = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--grain-alpha')) || .05;
    const c2 = document.createElement('canvas'); c2.width = c2.height = 180;
    const g2 = c2.getContext('2d'); g2.globalAlpha = alpha; g2.drawImage(c, 0, 0);
    document.documentElement.style.setProperty('--grain', `url(${c2.toDataURL()})`);
  } catch (e) { /* plain paper is fine */ }

  // ---------- sound: paper, made on the fly ----------
  const Sound = (() => {
    let ctx = null, noise = null, master = null, on = true;
    try { on = localStorage.getItem('ph-sound') !== 'off'; } catch (e) {}
    const ready = () => {
      if (!on) return null;
      if (!ctx) {
        try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
        const len = ctx.sampleRate;
        noise = ctx.createBuffer(1, len, ctx.sampleRate);
        const d = noise.getChannelData(0);
        for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
        master = ctx.createGain(); master.gain.value = .9; master.connect(ctx.destination);
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    };
    const grain = (t, gain, freq, dur) => {
      const s = ctx.createBufferSource(); s.buffer = noise;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = .8 + Math.random() * 1.6;
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + .0025);
      g.gain.exponentialRampToValueAtTime(.0005, t + dur);
      s.connect(bp).connect(g).connect(master);
      s.start(t, Math.random() * .85, dur + .03);
    };
    return {
      get on() { return on; },
      set on(v) { on = v; try { localStorage.setItem('ph-sound', v ? 'on' : 'off'); } catch (e) {} },
      crinkle(n = 6, over = .26, level = 1) {
        if (!ready()) return;
        const t0 = ctx.currentTime + .005;
        for (let i = 0; i < n; i++) {
          const t = t0 + Math.pow(Math.random(), 1.4) * over;
          grain(t, (.035 + Math.random() * .11) * level, 1700 + Math.random() * 4200, .012 + Math.random() * .035);
        }
      },
      swish(dur = .32, level = 1) {
        if (!ready()) return;
        const t = ctx.currentTime + .005;
        const s = ctx.createBufferSource(); s.buffer = noise;
        const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .7;
        bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(2600, t + dur * .7);
        const g = ctx.createGain();
        g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.075 * level, t + dur * .35);
        g.gain.exponentialRampToValueAtTime(.0005, t + dur);
        s.connect(bp).connect(g).connect(master); s.start(t, Math.random() * .5, dur + .05);
      },
      land(level = 1) {
        if (!ready()) return;
        const t = ctx.currentTime + .003;
        const s = ctx.createBufferSource(); s.buffer = noise;
        const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 520;
        const g = ctx.createGain(); g.gain.setValueAtTime(.22 * level, t); g.gain.exponentialRampToValueAtTime(.0005, t + .07);
        s.connect(lp).connect(g).connect(master); s.start(t, Math.random() * .5, .1);
        const o = ctx.createOscillator(); o.type = 'sine';
        o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(62, t + .09);
        const og = ctx.createGain(); og.gain.setValueAtTime(.11 * level, t); og.gain.exponentialRampToValueAtTime(.0005, t + .11);
        o.connect(og).connect(master); o.start(t); o.stop(t + .13);
        for (let i = 0; i < 3; i++) grain(t + .01 + Math.random() * .05, .04 * level, 2500 + Math.random() * 2500, .02);
      },
      pencil() {
        if (!ready()) return;
        const t = ctx.currentTime + .003;
        for (let i = 0; i < 2; i++) {
          const s = ctx.createBufferSource(); s.buffer = noise;
          const hp = ctx.createBiquadFilter(); hp.type = 'bandpass'; hp.frequency.value = 3200 + i * 1600; hp.Q.value = 1.4;
          const g = ctx.createGain(); const tt = t + i * .055;
          g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(.12, tt + .004); g.gain.exponentialRampToValueAtTime(.0005, tt + .045);
          s.connect(hp).connect(g).connect(master); s.start(tt, Math.random() * .8, .06);
        }
      }
    };
  })();
  const soundBtn = $('sound');
  soundBtn.setAttribute('aria-pressed', String(Sound.on));
  soundBtn.addEventListener('click', () => {
    Sound.on = !Sound.on; soundBtn.setAttribute('aria-pressed', String(Sound.on));
    if (Sound.on) Sound.crinkle(3, .08, .7);
  });
  const buzz = () => { try { navigator.vibrate && navigator.vibrate(6); } catch (e) {} };

  // ---------- rendering ----------
  let level = 'month', forceDuo = false;
  try { const h = location.hash.slice(1).split('-'); if (LEVELS[h[0]]) level = h[0]; forceDuo = h.includes('duo'); } catch (e) {}

  function rowsHtml(key, opts) {
    const L = LEVELS[key];
    const items = [...L.items, ...added[key]];
    return items.map((t, i) => {
      const id = key + ':' + t;
      const isNew = i >= L.items.length && opts.fresh === t;
      if (opts.doing) {
        const d = ticked.has(id);
        return `<li class="${d ? 'done' : ''}${isNew ? ' new' : ''}" data-id="${esc(id)}"><button type="button" class="check" aria-pressed="${d}" aria-label="Done: ${esc(t)}"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.6l4.6-5.2"/></svg></button><span class="txt">${esc(t)}</span></li>`;
      }
      return `<li class="${isNew ? 'new' : ''}"><span class="txt">${esc(t)}</span></li>`;
    }).join('');
  }

  function renderCurrent(fresh) {
    const L = LEVELS[level];
    const items = L.items.length + added[level].length;
    const doneNow = L.done + [...ticked].filter((x) => x.startsWith(level + ':')).length;
    const total = items + L.done;
    const openCount = items - (doneNow - L.done);
    current.innerHTML = `
      <div class="kicker">${esc(L.kicker)}</div>
      <h1 class="title">${esc(L.name)}</h1>
      <div class="meta"><span>${openCount} open · ${doneNow} done</span><span class="planned">${L.planned}</span></div>
      <div class="bar-progress" aria-hidden="true"><i style="width:${Math.round(doneNow / total * 100)}%"></i></div>
      <ul class="list" id="curList">${rowsHtml(level, { doing: !!L.doing, fresh })}</ul>
      <form class="add" id="addForm" autocomplete="off">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4z"/><path d="m14.5 5.5 3 3"/></svg>
        <input id="addInput" name="add" placeholder="${esc(L.add)}" aria-label="${esc(L.add)}">
        <span class="enter">Return to add</span></form>
      ${L.done ? `<div class="donefold">${L.done} done earlier${L.doneNames ? ' · ' + esc(L.doneNames) : ''}</div>` : ''}`;
    $('addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const v = $('addInput').value.trim(); if (!v) return;
      added[level].push(v); Sound.pencil(); renderCurrent(v);
      const inp = $('addInput'); inp && inp.focus();
    });
  }

  function renderAbove() {
    const k = ABOVE[level];
    if (!k) {
      spine.querySelector('.lbl').textContent = '2025';
      $('spineCnt').textContent = '0';
      aboveBody.innerHTML = `<div class="kicker">Last year</div><h2 class="title">2025</h2>
        <p class="empty">Nothing left open from 2025.</p>
        <div class="reading">${eye()} For reading</div>`;
      return;
    }
    const L = LEVELS[k];
    const n = L.items.length + added[k].length;
    spine.querySelector('.lbl').textContent = L.name;
    $('spineCnt').textContent = String(n);
    aboveBody.innerHTML = `<div class="kicker">${esc(L.kicker)}</div><h2 class="title">${esc(L.name)}</h2>
      <ul class="list">${rowsHtml(k, { doing: false })}</ul>
      ${L.done ? `<div class="donefold">${L.done} done</div>` : ''}
      <div class="reading">${eye()} For reading. Write ${esc(LEVELS[level].fold === 'This week' ? 'this week' : LEVELS[level].name)} in its own words.</div>`;
  }
  const eye = () => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';

  current.addEventListener('click', (e) => {
    const b = e.target.closest('.check'); if (!b) return;
    const li = b.closest('li'); const id = li.dataset.id;
    if (ticked.has(id)) ticked.delete(id); else { ticked.add(id); Sound.pencil(); buzz(); }
    const L = LEVELS[level];
    li.classList.toggle('done', ticked.has(id)); b.setAttribute('aria-pressed', String(ticked.has(id)));
    const doneNow = L.done + [...ticked].filter((x) => x.startsWith(level + ':')).length;
    const items = L.items.length + added[level].length;
    current.querySelector('.meta span').textContent = `${items - (doneNow - L.done)} open · ${doneNow} done`;
    current.querySelector('.bar-progress i').style.width = Math.round(doneNow / (items + L.done) * 100) + '%';
  });

  // ---------- geometry ----------
  let vertical = false, W = 340, H = 300, mode = '';
  let SPINE_W = 34; const SPINE_H = 46;
  // Which page shape: an open foldable (two screen segments, or a tall touch screen
  // shaped like A-paper, 600–900px wide), a narrow phone, or a wide screen.
  function detectMode() {
    const mm = (q) => { try { return matchMedia(q).matches; } catch (e) { return false; } };
    if (forceDuo || mm('(horizontal-viewport-segments: 2)')) return 'duo';
    const w = innerWidth, r = innerHeight / innerWidth;
    if (mm('(pointer: coarse)') && w >= 560 && w <= 900 && r >= 1.2 && r <= 1.65) return 'duo';
    return w < 760 ? 'v' : 'h';
  }
  const reduce = matchMedia('(prefers-reduced-motion: reduce)');

  function layout() {
    const was = mode;
    mode = detectMode();
    vertical = mode === 'v';
    document.body.classList.toggle('v', vertical);
    document.body.classList.toggle('h', !vertical);
    document.body.classList.toggle('duo', mode === 'duo');
    SPINE_W = mode === 'duo' ? 22 : 34;
    if (mode === 'duo') {
      flap.style.height = '';
      const avail = Math.min(innerWidth, forceDuo ? 640 : innerWidth) - 20;
      // The Duo's screen has no visible crease, so the page doesn't have to split
      // at the hinge: this period gets the room, the sheet above a reading column.
      W = Math.floor(avail * .38);
      document.documentElement.style.setProperty('--half', (avail - W) + 'px');
      flap.style.width = W + 'px';
      // Opening the phone opens the sheet; closing it folds the sheet away.
      if (was && was !== 'duo') { apply(p); go(1); return; }
      if (!was) { p = target = 1; }
      apply(p);
      return;
    }
    if (was === 'duo') { p = target = v = 0; }
    if (vertical) {
      flap.style.height = 'auto';
      const inner = aboveBody.scrollHeight;
      H = Math.min(inner + 2, Math.round(innerHeight * .62));
      flap.style.height = H + 'px';
    } else {
      flap.style.height = '';
      // Room for both sheets side by side: the sheet above takes a reading
      // column (about a third), this period keeps the rest, up to 560px.
      const avail = Math.min(1000, innerWidth - 32);
      W = Math.round(Math.min(340, Math.max(220, avail * .36)));
      const cur = Math.min(560, avail - W);
      document.documentElement.style.setProperty('--cur', cur + 'px');
      flap.style.width = W + 'px';
    }
    apply(p);
  }

  // ---------- the fold ----------
  let p = 0, v = 0, target = 0, raf = 0, landed = true, last = 0;
  function apply(x) {
    const q = Math.max(-.04, Math.min(1.04, x));
    spread.style.setProperty('--p', q.toFixed(4));
    const ang = (1 - q) * 180;
    if (vertical) {
      slot.style.width = '';
      slot.style.height = (SPINE_H + Math.max(0, q) * (H - SPINE_H)) + 'px';
      flap.style.transform = `rotateX(${ang.toFixed(2)}deg)`;
    } else {
      slot.style.height = '';
      slot.style.width = (SPINE_W + Math.max(0, q) * (W - SPINE_W)) + 'px';
      flap.style.transform = `rotateY(${(-ang).toFixed(2)}deg)`;
    }
    const open = q > .5;
    spread.classList.toggle('is-open', open);
    spine.setAttribute('aria-expanded', String(open));
    front.toggleAttribute('inert', !open);
    front.setAttribute('aria-hidden', String(!open));
    flap.style.visibility = q < .002 ? 'hidden' : 'visible';
  }
  function step(ts) {
    const dt = Math.min(.032, (ts - (last || ts)) / 1000 || .016); last = ts;
    const k = 170, c = 2 * Math.sqrt(k) * .78;
    const a = k * (target - p) - c * v;
    v += a * dt; p += v * dt;
    apply(p);
    if (!landed && Math.abs(target - p) < .03) { landed = true; Sound.land(target ? 1 : .8); buzz(); }
    if (Math.abs(target - p) < .0006 && Math.abs(v) < .002) { p = target; v = 0; apply(p); raf = 0; last = 0; return; }
    raf = requestAnimationFrame(step);
  }
  function go(to, fromDrag) {
    target = to; landed = false;
    if (reduce.matches) { p = to; v = 0; apply(p); Sound.land(.6); landed = true; return; }
    if (!fromDrag) { Sound.swish(.34); Sound.crinkle(7, .3); }
    if (!raf) { last = 0; raf = requestAnimationFrame(step); }
  }
  const toggle = () => go(target > .5 ? 0 : 1);

  // drag
  let drag = null;
  function down(e) {
    if (e.button !== undefined && e.button !== 0) return;
    drag = { x: e.clientX, y: e.clientY, p0: p, moved: 0, lastPos: p, lastT: performance.now(), vel: 0, acc: 0 };
    e.currentTarget.setPointerCapture(e.pointerId);
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    v = 0;
  }
  function move(e) {
    if (!drag) return;
    const d = vertical ? (e.clientY - drag.y) / (H - SPINE_H) : (drag.x - e.clientX) / (W - SPINE_W);
    drag.moved = Math.max(drag.moved, Math.abs(vertical ? e.clientY - drag.y : e.clientX - drag.x));
    const np = Math.max(-.05, Math.min(1.05, drag.p0 + d));
    const now = performance.now(); const dt = Math.max(1, now - drag.lastT);
    drag.vel = (np - drag.lastPos) / dt * 1000; drag.lastPos = np; drag.lastT = now;
    drag.acc += Math.abs(np - p);
    if (drag.acc > .05) { Sound.crinkle(1 + Math.round(Math.random() * 2), .04, .8); drag.acc = 0; }
    p = np; apply(p);
  }
  function up(e) {
    if (!drag) return;
    const d = drag; drag = null;
    if (d.moved < 4) { toggle(); return; }
    v = d.vel;
    const projected = p + v * .12;
    go(projected > .5 ? 1 : 0, true);
  }
  for (const el of [spine, grip]) {
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointermove', move);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } });
  }
  addEventListener('keydown', (e) => {
    if ((e.key === 'f' || e.key === 'F') && !e.metaKey && !e.ctrlKey && !(e.target instanceof HTMLInputElement)) toggle();
  });

  // horizons
  const tabs = document.querySelectorAll('.horizons button');
  function setLevel(k) {
    level = k;
    tabs.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.h === k)));
    renderCurrent(); renderAbove();
    current.classList.remove('swap'); void current.offsetWidth; current.classList.add('swap');
    layout();
    try { history.replaceState(null, '', '#' + k + (forceDuo ? '-duo' : '')); } catch (e) {}
  }
  tabs.forEach((b) => b.addEventListener('click', () => { if (b.dataset.h !== level) { Sound.crinkle(4, .14, .7); setLevel(b.dataset.h); } }));

  let rt = 0;
  addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 80); });
  setLevel(level);
})();
</script>
