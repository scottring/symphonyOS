<!doctype html>
<html lang="en">
<head>

<title>Duo outside screen</title>

</head>

<x-dc>
<helmet>

<style>
body{margin:0}
input::placeholder{color:#5F6966;opacity:1}
</style>
</helmet>
<div style="position: relative; width: 466px; height: 678px; overflow: hidden; background: #00106E; font-family: 'DM Sans', system-ui, sans-serif; color: #1F2A2B">

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 466px; height: 240px; overflow: hidden">

  </div>

  <nav aria-label="Where you are" style="position: absolute; left: 0; top: 22px; width: 466px; display: flex; justify-content: center; gap: 22px; font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,14,70,.7)">

    <span style="padding: 14px 3px 10px; color: #FFFFFF; font-weight: 600; border-bottom: 2px solid #F6DFA6">Today</span>
  </nav>

  <div aria-hidden="true" style="position: absolute; left: 70px; top: 82px; width: 7px; height: 130px; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, #5A4735, #2C2219); transform: rotate(-1deg); transform-origin: 50% 100%"></div>
  <button type="button" style="position: absolute; left: 42px; top: 96px; width: 350px; height: 60px; padding: 0; border: 2px solid #2C2219; border-right: none; border-radius: 4px 0 0 4px; background: #F6DFA6; text-align: left; cursor: pointer; transform: rotate(1.3deg); filter: drop-shadow(0 4px 5px rgba(0,14,70,.38)); font-family: inherit">
    <span aria-hidden="true" style="position: absolute; right: -21px; top: 7px; width: 42px; height: 42px; box-sizing: border-box; background: #F6DFA6; border-top: 2px solid #2C2219; border-right: 2px solid #2C2219; transform: rotate(45deg)"></span>
    <span aria-hidden="true" style="position: absolute; left: 26px; top: 0; bottom: 0; width: 7px; background: rgba(44,34,25,.14)"></span>
    <span aria-hidden="true" style="position: absolute; left: 26px; top: 5px; width: 7px; height: 7px; box-sizing: border-box; border-radius: 50%; border: 1px solid #2C2219; background: radial-gradient(circle at 35% 30%, #EFE9DB, #8C8474 72%)"></span>
    <span aria-hidden="true" style="position: absolute; left: 26px; bottom: 5px; width: 7px; height: 7px; box-sizing: border-box; border-radius: 50%; border: 1px solid #2C2219; background: radial-gradient(circle at 35% 30%, #EFE9DB, #8C8474 72%)"></span>
    <span style="position: absolute; left: 44px; top: 8px; display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 1.4px; color: #6B4A1F">FIRST, TODAY</span>
    <span style="position: absolute; left: 44px; top: 24px; display: block; font-family: 'Crimson Pro', serif; font-size: 20px; font-weight: 500; color: #2C2219; white-space: nowrap">Send the contractor the deposit</span>
  </button>

  <div style="position: absolute; left: 0; top: 190px; width: 466px; height: 488px; box-sizing: border-box; background: #FBF8F2; border-radius: 26px 26px 0 0; box-shadow: 0 -8px 26px rgba(0,14,70,.3)">
    <div aria-hidden="true" style="position: absolute; left: 211px; top: 9px; width: 44px; height: 5px; border-radius: 3px; background: #D4CDC0"></div>
    <div style="position: absolute; left: 22px; top: 26px; width: 422px; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 1.5px; color: #56625F">TODAY</span>
        <span style="font-family: 'Crimson Pro', serif; font-size: 27px; line-height: 32px; color: #1F2A2B">Tuesday, 10 November</span>
      </div>
      <div role="img" aria-label="1 of 4 done" style="position: relative; width: 52px; height: 52px">
        <svg viewBox="0 0 56 56" width="52" height="52" aria-hidden="true" style="transform: rotate(-90deg)">
          <circle cx="28" cy="28" r="23" fill="none" stroke="#E2DCCF" stroke-width="6"></circle>
          <circle cx="28" cy="28" r="23" fill="none" stroke="#32664D" stroke-width="6" stroke-linecap="round" stroke-dasharray="36.1 144.5"></circle>

        <span style="position: absolute; left: 0; top: 16px; width: 52px; text-align: center; font-size: 14px; font-weight: 600">1/4</span>
      </div>
    </div>

    <div style="position: absolute; left: 16px; top: 90px; width: 434px; height: 42px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; background: #FBEBE3; border: 1px solid #F0CDBD; border-radius: 14px">
      <span style="font-family: 'Crimson Pro', serif; font-size: 19px; color: #9A3D1F">3:00</span>
      <span style="font-size: 15.5px">Bathroom design meeting</span>
      <span style="margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; color: #9A3D1F">NEXT</span>
    </div>

    <div style="position: absolute; left: 16px; top: 142px; width: 434px; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{ rows }}" as="row" hint-placeholder-count="4">
        <button type="button" style="width: 434px; height: 52px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E6E0D6; border-radius: 16px; text-align: left; font-family: inherit; cursor: pointer">
          <span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{ row.ring }}; background: {{ row.fill }}"></span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 16px; line-height: 20px; font-weight: 500; color: {{ row.ink }}; text-decoration: {{ row.deco }}; text-decoration-color: #A9B0AD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ row.title }}</span>
            <sc-if value="{{ row.hasGoal }}" hint-placeholder-val="{{ true }}">
              <span style="display: flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 16px; color: #4A5654">
                <svg viewBox="0 0 12 14" width="10" height="12" aria-hidden="true"><path d="M2 1v12" stroke="#2C2219" stroke-width="1.4" stroke-linecap="round"></path><path d="M2.7 1.6h7.6l-2 2.6 2 2.6H2.7z" fill="#A8452C"></path></svg>
                for <span style="font-family: 'Crimson Pro', serif; font-size: 14.5px; color: #32664D">{{ row.goal }}</span>
              </span>
            </sc-if>
          </span>
        </button>
      </sc-for>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; top: 580px; width: 466px; height: 98px; background: #FBF8F2"></div>
  <div style="position: absolute; left: 68px; top: 604px; width: 330px; height: 48px; box-sizing: border-box; padding: 0 5px 0 18px; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1.5px solid #CFC8BA; border-radius: 24px">
    <input type="text" aria-label="Add to today" placeholder="Add to today" style="flex: 1; min-width: 0; height: 40px; padding: 0; border: none; outline: none; background: none; font-family: inherit; font-size: 16px; color: #1F2A2B">
    <button type="button" aria-label="Speak it" style="flex: none; width: 38px; height: 38px; padding: 0; border: none; border-radius: 50%; background: radial-gradient(circle at 42% 36%, #FFFDF4 0%, #FFF0CC 38%, #F7CF83 72%, #E0A24A 100%); box-shadow: 0 0 0 1px rgba(185,118,40,.3); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#2C2219" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>
    </button>
  </div>
  <button type="button" aria-label="More" style="position: absolute; left: 8px; top: 600px; width: 56px; height: 56px; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 10.5px; color: #56625F; cursor: pointer">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="#56625F" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
    More
  </button>
  <button type="button" aria-label="Inbox" style="position: absolute; left: 402px; top: 600px; width: 56px; height: 56px; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-family: inherit; font-size: 10.5px; color: #56625F; cursor: pointer">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#56625F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
    Inbox
  </button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":466,"height":678}}'>
class Component extends DCLogic {
  renderVals() {
    const open = { ink: '#1F2A2B', deco: 'none', ring: '#857D72', fill: 'transparent' };
    const done = { ink: '#6B7472', deco: 'line-through', ring: '#32664D', fill: '#32664D' };
    return { rows: [
      { title: 'Send the contractor the deposit', goal: 'Finish the bathroom', hasGoal: true, ...open },
      { title: 'Tour the gym on Main Street', goal: 'Feel strong again', hasGoal: true, ...open },
      { title: 'Renew the passport', goal: '', hasGoal: false, ...open },
      { title: 'Call Mum about Sunday lunch', goal: 'More slow weekends together', hasGoal: true, ...done }
    ] };
  }
}
</script>
</body>
</html>
