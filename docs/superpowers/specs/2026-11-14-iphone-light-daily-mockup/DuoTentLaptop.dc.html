    <div aria-hidden="true" style="position: absolute; left: 74px; top: 310px; width: 8px; height: 150px; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, #5A4735, #2C2219); transform: rotate(1deg); transform-origin: 50% 100%"></div>
    <div style="position: absolute; left: 44px; top: 330px; width: 470px; height: 78px; box-sizing: border-box; border: 2px solid #2C2219; border-right: none; border-radius: 4px 0 0 4px; background: #F6DFA6; transform: rotate(-1.3deg); filter: drop-shadow(0 5px 6px rgba(0,14,70,.4))">

    <sc-for list="{{ rows }}" as="row" hint-placeholder-count="3">
      <button type="button" style="width: 578px; height: 72px; box-sizing: border-box; padding: 0 18px; display: flex; align-items: center; gap: 16px; background: #FFFFFF; border: 1px solid #E6E0D6; border-radius: 20px; text-align: left; font-family: inherit; cursor: pointer">

          <span style="font-size: 22px; line-height: 27px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ row.title }}</span>
          <sc-if value="{{ row.hasGoal }}" hint-placeholder-val="{{ true }}">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 15px; line-height: 19px; color: #4A5654">

            </span>
          </sc-if>
        </span>
      </button>
    </sc-for>

  <span style="position: absolute; left: 34px; top: 776px; font-size: 14px; color: #56625F">1 done</span>
  <div style="position: absolute; left: 24px; top: 808px; width: 578px; height: 58px; box-sizing: border-box; padding: 0 7px 0 24px; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1.5px solid #CFC8BA; border-radius: 29px">
    <input type="text" aria-label="Add to today" placeholder="Add to today" style="flex: 1; min-width: 0; height: 46px; padding: 0; border: none; outline: none; background: none; font-family: inherit; font-size: 20px; color: #1F2A2B">
    <button type="button" aria-label="Speak it" style="flex: none; width: 44px; height: 44px; padding: 0; border: none; border-radius: 50%; background: radial-gradient(circle at 42% 36%, #FFFDF4 0%, #FFF0CC 38%, #F7CF83 72%, #E0A24A 100%); box-shadow: 0 0 0 1px rgba(185,118,40,.3); display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#2C2219" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>
    </button>

</div>

      { title: 'Renew the passport', goal: '', hasGoal: false }
    ] };
  }
}
</script>
