<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@400;500;600&family=DM+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
a{color:#FFFFFF}a:hover{color:#F6DFA6}
input::placeholder{color:#5F6966;opacity:1}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #00106E; font-family: 'DM Sans', system-ui, sans-serif; color: #1F2A2B">

  <div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 340px; overflow: hidden">
    <img src="/_blob/74f18a7a69d11ab4ae0ee82ef04f5e82" alt="" style="position: absolute; left: -20px; top: 0; width: 430px; height: 430px">
  </div>

  <nav aria-label="Where you are" style="position: absolute; left: 0; top: 44px; width: 390px; display: flex; justify-content: center; gap: 18px; font-size: 11.5px; letter-spacing: 1.5px; text-transform: uppercase; text-shadow: 0 1px 6px rgba(0,14,70,.7)">
    <a href="Year.dc.html" style="padding: 14px 3px; color: rgba(255,255,255,.78); text-decoration: none">Year</a>
    <span style="padding: 14px 3px; color: rgba(255,255,255,.78)">Season</span>
    <a href="Month.dc.html" style="padding: 14px 3px; color: rgba(255,255,255,.78); text-decoration: none">Month</a>
    <a href="Week.dc.html" style="padding: 14px 3px; color: rgba(255,255,255,.78); text-decoration: none">Week</a>
    <span style="padding: 14px 3px 10px; color: #FFFFFF; font-weight: 600; border-bottom: 2px solid #F6DFA6">Today</span>
  </nav>

  <div aria-hidden="true" style="position: absolute; left: 52px; top: 128px; width: 7px; height: 176px; border-radius: 3px 3px 0 0; background: linear-gradient(90deg, #5A4735, #2C2219); transform: rotate(1deg); transform-origin: 50% 100%"></div>
  <button type="button" onClick="{{ point }}" style="position: absolute; left: 24px; top: 148px; width: 304px; height: 64px; padding: 0; border: 2px solid #2C2219; border-right: none; border-radius: 4px 0 0 4px; background: #F6DFA6; text-align: left; cursor: pointer; transform: rotate(-1.6deg); filter: drop-shadow(0 4px 5px rgba(0,14,70,.38)); font-family: inherit">
    <span aria-hidden="true" style="position: absolute; right: -23px; top: 7.5px; width: 45px; height: 45px; box-sizing: border-box; background: #F6DFA6; border-top: 2px solid #2C2219; border-right: 2px solid #2C2219; transform: rotate(45deg)"></span>
    <span aria-hidden="true" style="position: absolute; left: 26px; top: 0; bottom: 0; width: 7px; background: rgba(44,34,25,.14)"></span>
    <span aria-hidden="true" style="position: absolute; left: 26px; top: 5px; width: 7px; height: 7px; box-sizing: border-box; border-radius: 50%; border: 1px solid #2C2219; background: radial-gradient(circle at 35% 30%, #EFE9DB, #8C8474 72%)"></span>
    <span aria-hidden="true" style="position: absolute; left: 26px; bottom: 5px; width: 7px; height: 7px; box-sizing: border-box; border-radius: 50%; border: 1px solid #2C2219; background: radial-gradient(circle at 35% 30%, #EFE9DB, #8C8474 72%)"></span>
    <sc-if value="{{ going }}" hint-placeholder-val="{{ true }}">
      <span style="position: absolute; left: 46px; top: 9px; display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 1.4px; color: #6B4A1F">FIRST, TODAY</span>
      <span style="position: absolute; left: 46px; top: 26px; display: block; font-family: 'Crimson Pro', serif; font-size: 19px; font-weight: 500; color: #2C2219; white-space: nowrap">Send the contractor the deposit</span>
    </sc-if>
    <sc-if value="{{ allDone }}" hint-placeholder-val="{{ false }}">
      <span style="position: absolute; left: 46px; top: 9px; display: block; font-size: 10.5px; font-weight: 600; letter-spacing: 1.4px; color: #6B4A1F">THAT&#39;S THE DAY</span>
      <span style="position: absolute; left: 46px; top: 26px; display: block; font-family: 'Crimson Pro', serif; font-size: 19px; font-weight: 500; color: #2C2219; white-space: nowrap">Tomorrow: Choose the tile</span>
    </sc-if>
  </button>

  <div style="position: absolute; left: 0; top: 286px; width: 390px; height: 558px; box-sizing: border-box; background: #FBF8F2; border-radius: 28px 28px 0 0; box-shadow: 0 -8px 26px rgba(0,14,70,.3)">
    <div aria-hidden="true" style="position: absolute; left: 173px; top: 9px; width: 44px; height: 5px; border-radius: 3px; background: #D4CDC0"></div>
    <button type="button" style="position: absolute; left: 115px; top: 16px; width: 160px; height: 24px; border: none; background: none; font-family: inherit; font-size: 12px; font-weight: 500; color: #56625F; cursor: pointer">Look back up</button>

    <div style="position: absolute; left: 22px; top: 46px; width: 346px; display: flex; justify-content: space-between; align-items: center">
      <div style="display: flex; flex-direction: column; gap: 1px">
        <span style="font-size: 11px; font-weight: 500; letter-spacing: 1.5px; color: #56625F">TODAY</span>
        <span style="font-family: 'Crimson Pro', serif; font-size: 27px; line-height: 32px; color: #1F2A2B">Tuesday, 10 November</span>
      </div>
      <div role="img" aria-label="{{ ringLabel }}" style="position: relative; width: 56px; height: 56px">
        <svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true" style="transform: rotate(-90deg)">
          <circle cx="28" cy="28" r="23" fill="none" stroke="#E2DCCF" stroke-width="6"></circle>
          <circle cx="28" cy="28" r="23" fill="none" stroke="#32664D" stroke-width="6" stroke-linecap="round" stroke-dasharray="{{ ringDash }}"></circle>
        </svg>
        <span style="position: absolute; left: 0; top: 18px; width: 56px; text-align: center; font-size: 14px; font-weight: 600; color: #1F2A2B">{{ ringText }}</span>
      </div>
    </div>

    <div style="position: absolute; left: 16px; top: 110px; width: 358px; height: 44px; box-sizing: border-box; padding: 0 14px; display: flex; align-items: center; gap: 12px; background: #FBEBE3; border: 1px solid #F0CDBD; border-radius: 14px">
      <span style="font-family: 'Crimson Pro', serif; font-size: 19px; color: #9A3D1F">3:00</span>
      <span style="font-size: 15.5px; color: #1F2A2B">Bathroom design meeting</span>
      <span style="margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: 1.2px; color: #9A3D1F">NEXT</span>
    </div>

    <div style="position: absolute; left: 16px; top: 164px; width: 358px; display: flex; flex-direction: column; gap: 6px">
      <sc-for list="{{ rows }}" as="row" hint-placeholder-count="4">
        <button type="button" onClick="{{ row.toggle }}" aria-pressed="{{ row.done }}" style="width: 358px; height: 54px; box-sizing: border-box; padding: 0 12px; display: flex; align-items: center; gap: 12px; background: #FFFFFF; border: 1px solid #E6E0D6; border-radius: 16px; box-shadow: {{ row.halo }}; text-align: left; font-family: inherit; cursor: pointer">
          <span aria-hidden="true" style="flex: none; width: 26px; height: 26px; box-sizing: border-box; border-radius: 50%; border: 2px solid {{ row.ring }}; background: {{ row.fill }}; display: flex; align-items: center; justify-content: center">
            <sc-if value="{{ row.done }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"></path></svg>
            </sc-if>
          </span>
          <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 16px; line-height: 20px; font-weight: 500; color: {{ row.ink }}; text-decoration: {{ row.deco }}; text-decoration-color: #A9B0AD; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ row.title }}</span>
            <sc-if value="{{ row.hasGoal }}" hint-placeholder-val="{{ true }}">
              <span style="display: flex; align-items: center; gap: 5px; font-size: 12.5px; line-height: 16px; color: #4A5654">
                <svg viewBox="0 0 12 14" width="10" height="12" aria-hidden="true"><path d="M2 1v12" stroke="#2C2219" stroke-width="1.4" stroke-linecap="round"></path><path d="M2.7 1.6h7.6l-2 2.6 2 2.6H2.7z" fill="#A8452C"></path></svg>
                for <span style="font-family: 'Crimson Pro', serif; font-size: 14.5px; color: #32664D">{{ row.goal }}</span>
              </span>
            </sc-if>
          </span>
          <sc-if value="{{ row.first }}" hint-placeholder-val="{{ false }}">
            <svg viewBox="0 0 14 16" width="14" height="16" role="img" aria-label="First today" style="flex: none"><path d="M2 1v14" stroke="#2C2219" stroke-width="1.5" stroke-linecap="round"></path><path d="M2.8 1.8h9.4l-2.6 3 2.6 3H2.8z" fill="#E0A24A"></path></svg>
          </sc-if>
        </button>
      </sc-for>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; top: 696px; width: 390px; height: 44px; background: linear-gradient(to bottom, rgba(251,248,242,0), #FBF8F2); pointer-events: none"></div>
  <div aria-hidden="true" style="position: absolute; left: 0; top: 740px; width: 390px; height: 104px; background: #FBF8F2"></div>

  <sc-if value="{{ speaking }}" hint-placeholder-val="{{ false }}">
    <span style="position: absolute; left: 0; top: 724px; width: 390px; text-align: center; font-size: 12.5px; color: #56625F">Listening. Say a day and it goes there.</span>
  </sc-if>

  <sc-if value="{{ handover }}" hint-placeholder-val="{{ false }}">
    <span style="position: absolute; left: 0; top: 724px; width: 390px; text-align: center; font-size: 12.5px; color: #56625F">The light lives here now. Type, or tap it to speak.</span>
  </sc-if>

  <sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}">
    <button type="button" aria-label="Inbox" style="position: absolute; left: 328px; top: 752px; width: 52px; height: 52px; padding: 0; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 10.5px; color: #56625F; cursor: pointer">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#56625F" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-6l-2 3h-4l-2-3H2"></path><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"></path></svg>
      Inbox
    </button>
    <button type="button" aria-label="More" style="position: absolute; left: 8px; top: 752px; width: 52px; height: 52px; padding: 0; border: none; background: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-family: inherit; font-size: 10.5px; color: #56625F; cursor: pointer">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="#56625F" aria-hidden="true"><circle cx="5" cy="12" r="1.8"></circle><circle cx="12" cy="12" r="1.8"></circle><circle cx="19" cy="12" r="1.8"></circle></svg>
      More
    </button>
  </sc-if>

  <div style="position: absolute; left: {{ fieldLeft }}; top: 754px; width: {{ fieldWidth }}; height: 48px; box-sizing: border-box; padding: 0 5px 0 18px; display: flex; align-items: center; gap: 6px; background: #FFFFFF; border: 1.5px solid {{ fieldLine }}; border-radius: 24px">
    <input type="text" aria-label="Add to today" placeholder="Add to today" value="{{ draft }}" onChange="{{ onDraft }}" onKeyDown="{{ onKey }}" style="flex: 1; min-width: 0; height: 40px; padding: 0; border: none; outline: none; background: none; font-family: inherit; font-size: 16px; color: #1F2A2B">
    <button type="button" aria-label="Speak it" style="flex: none; width: 38px; height: 38px; padding: 0; border: none; border-radius: 50%; background: {{ micFill }}; box-shadow: {{ micHalo }}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="{{ micInk }}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><path d="M12 19v3"></path></svg>
    </button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["morning","speaking","done","handover"],"default":"morning"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = {};
  renderVals() {
    const mode = this.props.mode ?? 'morning';
    const s = this.state || {};
    const done = s.done ?? (mode === 'done' ? { t1: true, t2: true, t3: true, t4: true } : { t4: true });
    const speaking = mode === 'speaking';
    const handover = mode === 'handover';
    const extra = s.extra ?? [];
    const tasks = [
      { id: 't1', title: 'Send the contractor the deposit', goal: 'Finish the bathroom', first: true },
      { id: 't2', title: 'Tour the gym on Main Street', goal: 'Feel strong again' },
      { id: 't3', title: 'Renew the passport', goal: '' },
      { id: 't4', title: 'Call Mum about Sunday lunch', goal: 'More slow weekends together' }
    ].concat(extra);
    const rows = tasks.map((t) => {
      const d = !!done[t.id];
      return {
        title: t.title, goal: t.goal, hasGoal: !!t.goal, first: !!t.first && !d, done: d,
        ink: d ? '#6B7472' : '#1F2A2B', deco: d ? 'line-through' : 'none',
        ring: d ? '#32664D' : '#857D72', fill: d ? '#32664D' : 'transparent',
        halo: (s.pointed && t.first && !d) ? '0 0 0 3px #F6DFA6' : '0 1px 0 rgba(31,42,43,.04)',
        toggle: () => this.setState({ done: { ...done, [t.id]: !d }, pointed: false })
      };
    });
    const count = rows.filter((r) => r.done).length;
    const allDone = count === rows.length;
    const draft = speaking ? 'Call the plumber about the leak' : (s.draft ?? '');
    return {
      rows, allDone, going: !allDone, speaking, idle: !speaking, draft,
      ringDash: (144.5 * count / rows.length).toFixed(1) + ' 144.5',
      ringText: count + '/' + rows.length,
      ringLabel: count + ' of ' + rows.length + ' done',
      fieldLeft: speaking ? '14px' : '64px',
      fieldWidth: speaking ? '362px' : '262px',
      fieldLine: speaking ? '#9A3D1F' : '#CFC8BA',
      handover,
      micFill: speaking ? '#9A3D1F' : 'radial-gradient(circle at 42% 36%, #FFFDF4 0%, #FFF0CC 38%, #F7CF83 72%, #E0A24A 100%)',
      micInk: speaking ? '#FFFFFF' : '#2C2219',
      micHalo: speaking ? '0 0 0 5px rgba(154,61,31,.18)' : (handover ? '0 0 0 7px rgba(246,223,166,.6), 0 0 26px 10px rgba(255,214,140,.95)' : '0 0 0 1px rgba(185,118,40,.3)'),
      point: () => this.setState({ pointed: !s.pointed }),
      onDraft: (e) => this.setState({ draft: e.target.value }),
      onKey: (e) => {
        const text = (s.draft ?? '').trim();
        if (e.key !== 'Enter' || !text || extra.length >= 1) return;
        this.setState({ draft: '', extra: extra.concat([{ id: 'x' + extra.length, title: text, goal: '' }]) });
      }
    };
  }
}
</script>
</body>
</html>
