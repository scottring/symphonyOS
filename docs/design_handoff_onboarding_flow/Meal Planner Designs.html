<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Symphony · Meal Planner — Designs</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="artboards/RecipeLibrary.jsx"></script>

<script type="text/babel" src="artboards/StatesAndDocs.jsx"></script>
<script type="text/babel" src="artboards/PlannerV2.jsx"></script>
<script type="text/babel" src="artboards/AskSymphony.jsx"></script>

<script type="text/babel" src="artboards/Onboarding.jsx"></script>

<script type="text/babel" data-presets="react">
function App() {

          <OB_Rhythms />

          <PV3_Chat />

        <DCArtboard id="v3-scaffold"   label="6 · Recipe scaffold view (kitchen mode)" width={1280} height={1700}>

</html>
