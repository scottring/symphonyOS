app = "symphony-connectors"
primary_region = "ewr"

[build]

[env]
  STATE_DIR = "/data"
  HOUSEHOLD_TIMEZONE = "America/New_York"
  FLUSH_HOURS_LOCAL = "17"

[mounts]
  source = "connector_state"
  destination = "/data"

# One machine only. Two would hold two WhatsApp sessions and double-deliver.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[deploy]
  strategy = "immediate"

# Restart whenever the process exits, without the on-failure policy's limit
# of ten tries: on 2026-11-08 ten quick crashes left the machine stopped and
# the 5pm digest silent for days.
[[restart]]
  policy = "always"
